<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUDA GEMM 双缓冲与流水线 - Interactive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(1100px 540px at 6% -8%, rgba(59,130,246,.11), transparent 62%),
        radial-gradient(900px 480px at 98% 2%, rgba(16,185,129,.09), transparent 60%),
        radial-gradient(900px 560px at 50% 108%, rgba(124,58,237,.08), transparent 62%),
        #f7f9fc;
      color: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(226,232,240,.95);
      border-radius: 22px;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 16px 36px -16px rgba(15,23,42,.16);
      backdrop-filter: blur(8px);
      transition: box-shadow .25s ease, transform .25s ease;
    }
    .card:hover { box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 22px 46px -18px rgba(15,23,42,.22); }
    .soft-card {
      border-radius: 18px;
      border: 1px solid rgba(226,232,240,.9);
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .soft-card:hover { box-shadow: 0 8px 22px -12px rgba(15,23,42,.28); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .flow-line { stroke-dasharray: 9 8; animation: dash 1.0s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -34; } }
    .pulse-soft { animation: pulseSoft 1.1s ease-in-out infinite; }
    @keyframes pulseSoft {
      0%,100% { opacity: .5; }
      50% { opacity: 1; }
    }
    .num-badge {
      width: 2.15rem; height: 2.15rem;
      border-radius: .85rem;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; color: #fff; font-size: .95rem;
      background: linear-gradient(135deg, #2563eb, #059669);
      box-shadow: 0 8px 16px -8px rgba(37,99,235,.9);
      flex: none;
    }
    .glass-bar {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(226,232,240,.9);
      box-shadow: 0 10px 30px -18px rgba(15,23,42,.35);
      backdrop-filter: blur(14px);
    }
    .btn {
      border-radius: 12px; font-weight: 700; font-size: .875rem;
      padding: .5rem .95rem;
      transition: all .18s ease;
      box-shadow: 0 1px 2px rgba(15,23,42,.06);
    }
    .btn-ghost { background: #fff; border: 1px solid #e2e8f0; color: #334155; }
    .btn-ghost:hover { background: #f8fafc; border-color: #cbd5e1; transform: translateY(-1px); }
    .btn-dark { background: #0f172a; color: #fff; border: 1px solid #0f172a; }
    .btn-dark:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -10px rgba(15,23,42,.9); }
    .btn-blue { background: linear-gradient(135deg,#2563eb,#3b82f6); color: #fff; border: 1px solid #2563eb; }
    .btn-blue:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(37,99,235,.9); }
    .chip {
      border-radius: 12px; font-size: .72rem; font-weight: 800;
      padding: .4rem .7rem; border: 1px solid #e2e8f0; background: #fff; color: #64748b;
      transition: all .18s ease; white-space: nowrap;
    }
    .chip:hover { border-color: #93c5fd; color: #1d4ed8; }
    .chip-done { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .chip-now {
      background: linear-gradient(135deg,#2563eb,#3b82f6);
      border-color: #2563eb; color: #fff;
      box-shadow: 0 8px 16px -8px rgba(37,99,235,.9);
    }
    input[type="range"] { height: 1.25rem; }
    .scrollbar-thin::-webkit-scrollbar { height: 8px; width: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(59,130,246,.25);
      outline-offset: 2px;
    }
    .hairline { height: 1px; background: linear-gradient(to right, transparent, #e2e8f0 20%, #e2e8f0 80%, transparent); }
    svg text { user-select: none; }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

// -----------------------------------------------------------------
// 与 matmul_buffer.cuh 一致的常量
//   BLOCK 128×128, BK=8, warp 4×8, lane tile 8×8, 256 线程
//   A_F4_PER_THREAD = (128×8/4)/256 = 2, B_F4_PER_THREAD = (8×128/4)/256 = 1
// -----------------------------------------------------------------
const BK = 8;
const A_F4 = 2, B_F4 = 1;

function Pill({children, color="slate"}) {
  const styles = {
    blue:"bg-blue-50 text-blue-700 border-blue-200",
    green:"bg-emerald-50 text-emerald-700 border-emerald-200",
    orange:"bg-orange-50 text-orange-700 border-orange-200",
    rose:"bg-rose-50 text-rose-700 border-rose-200",
    purple:"bg-violet-50 text-violet-700 border-violet-200",
    slate:"bg-slate-50 text-slate-600 border-slate-200",
  };
  return <span className={"inline-flex items-center px-2.5 py-1 rounded-full border text-xs font-semibold tracking-tight "+styles[color]}>{children}</span>
}

function ProgressBar({value, color="bg-blue-500"}) {
  return (
    <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
      <div className={"h-full rounded-full transition-all duration-300 "+color} style={{width:`${Math.max(0,Math.min(100,value))}%`}} />
    </div>
  )
}

function SecTitle({n, title, children, right}) {
  return (
    <div className="flex flex-col xl:flex-row xl:items-end xl:justify-between gap-4 mb-5">
      <div className="flex items-start gap-3">
        <div className="num-badge">{n}</div>
        <div>
          <h2 className="text-xl sm:text-[1.4rem] font-black tracking-tight text-slate-900 leading-snug">{title}</h2>
          {children ? <p className="text-sm text-slate-500 mt-1.5 leading-6 max-w-3xl">{children}</p> : null}
        </div>
      </div>
      {right ? <div className="flex flex-wrap items-center gap-2">{right}</div> : null}
    </div>
  )
}

// 步骤描述（每 K tile 21 步）
function stepInfo(step) {
  if (step === 0) return {group:"ldg", kk:0, label:"发射 LDG：下一 tile → ldg_stash（异步，立即返回）"};
  if (step >= 1 && step <= 16) {
    const kk = Math.floor((step-1)/2), sub = (step-1)%2;
    return {group:"ploop", kk, sub,
      label: sub===0 ? `预取 reg_A/B[${(kk+1)&1}] ← smem[buf] 的第 kk+1=${kk+1} 步（LDS）`
                     : `FFMA(kk=${kk})：用 reg[${kk&1}] 做 8×8 外积（64 FMA）`};
  }
  if (step === 17) return {group:"sts", label:"STS：ldg_stash → smem[next_buf]（此时 LDG 数据通常已到达）"};
  if (step === 18) return {group:"sync", label:"__syncthreads()：唯一同步点 —— 之后安全切换 buffer"};
  if (step === 19) return {group:"prefetch0", label:"预取新 buffer 的 kk=0 寄存器（reg_A/B[0]）"};
  return {group:"swap", label:"buf = next_buf，进入下一 K tile"};
}

// =================================================================
// Section 1：串行 vs 双缓冲 时间轴
// =================================================================
function TimelinePanel({mode, tile, step}) {
  // 每 tile 宽 240：串行 [LDG100 STS30 | LDS20 | FFMA80 | sync10]
  //               双缓冲 [FFMA 230 连续][STS@200][sync@230]，LDG 异步错位
  const tiles = 4;
  const tw = 240;
  const W = tiles*tw + 90, H = 208;
  const x0 = 84;
  const rows = [
    {name:"Global 搬运", y:36},
    {name:"FFMA", y:76},
    {name:"LDS 预取", y:116},
    {name:"STS / 同步", y:156},
  ];

  // 光标位置：由 (tile, step) 粗略映射到周期
  let cursor = null;
  if (mode === "serial") {
    const per = [100, 30, 20, 80, 10]; // ldg sts lds ffma sync 占比
    const seg = step===0?0 : step<=16 ? 3 : step===17?1 : step===18?4 : step===19?2 : 4;
    let off = 0;
    for (let i=0;i<seg;i++) off += per[i];
    cursor = x0 + tile*tw + off + (step<=16 && step>=1 ? ((step-1)%2)*40 : 0);
  } else {
    const map = {0: 0, 17: 200, 18: 230, 19: 232, 20: 238};
    if (step===0) cursor = x0 + tile*tw;
    else if (step>=1 && step<=16) cursor = x0 + tile*tw + 20 + ((step-1)/16)*180;
    else cursor = x0 + tile*tw + (map[step] ?? 0);
  }

  return (
    <div className="overflow-x-auto scrollbar-thin">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full min-w-[680px]">
        {/* 行标签 */}
        {rows.map(r=><text key={r.name} x="6" y={r.y+14} fontSize="10.5" fontWeight="700" fill="#475569">{r.name}</text>)}
        {/* tile 分隔 */}
        {Array.from({length:tiles}).map((_,t)=>(
          <g key={"tl"+t}>
            <line x1={x0+t*tw} x2={x0+t*tw} y1="24" y2={H-30} stroke="#e2e8f0" strokeDasharray="4 4"/>
            <text x={x0+t*tw+tw/2} y="16" textAnchor="middle" fontSize="10" fontWeight="700" fill="#94a3b8">tile {t}</text>
          </g>
        ))}

        {Array.from({length:tiles}).map((_,t)=>{
          const x = x0 + t*tw;
          if (mode === "serial") {
            return (
              <g key={"s"+t}>
                <rect x={x} y={rows[0].y} width="130" height="26" rx="6" fill="#93c5fd"/>
                <text x={x+65} y={rows[0].y+17} textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#1e3a8a">LDG+STS（300c 级）</text>
                <rect x={x+130} y={rows[1].y} width="80" height="26" rx="6" fill="#fca5a5"/>
                <text x={x+170} y={rows[1].y+17} textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#7f1d1d">FFMA</text>
                <rect x={x+210} y={rows[1].y} width="30" height="26" rx="6" fill="#e2e8f0"/>
                <rect x={x+130} y={rows[2].y} width="20" height="26" rx="6" fill="#c4b5fd"/>
                <rect x={x+150} y={rows[2].y} width="60" height="26" rx="6" fill="#f1f5f9"/>
                <text x={x+180} y={rows[2].y+17} textAnchor="middle" fontSize="9" fill="#94a3b8">等待</text>
                <rect x={x+210} y={rows[3].y} width="30" height="26" rx="6" fill="#86efac"/>
                <text x={x+225} y={rows[3].y+17} textAnchor="middle" fontSize="8.5" fontWeight="700" fill="#14532d">sync</text>
                {/* 空转区标注 */}
                <rect x={x} y={rows[1].y} width="130" height="26" rx="6" fill="none" stroke="#fca5a5" strokeDasharray="4 3"/>
                <text x={x+65} y={rows[1].y-6} textAnchor="middle" fontSize="8.5" fill="#dc2626">计算单元空转</text>
              </g>
            );
          }
          return (
            <g key={"d"+t}>
              {/* LDG：异步发射，跨越本 tile 前半段（取下一 tile 数据） */}
              <rect x={x} y={rows[0].y} width="150" height="26" rx="6" fill="#93c5fd" opacity="0.85" className="flow-line"/>
              <text x={x+75} y={rows[0].y+17} textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#1e3a8a">LDG(tile {t+1}) 后台飞行</text>
              {/* FFMA 连续 */}
              <rect x={x} y={rows[1].y} width="230" height="26" rx="6" fill="#fca5a5"/>
              <text x={x+115} y={rows[1].y+17} textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#7f1d1d">FFMA 全速（计算单元不空转）</text>
              {/* LDS 预取嵌在 FFMA 之间 */}
              {[30, 90, 150].map((px,i)=>(
                <rect key={"lds"+i} x={x+px} y={rows[2].y} width="26" height="26" rx="6" fill="#c4b5fd"/>
              ))}
              <text x={x+120} y={rows[2].y+42} textAnchor="middle" fontSize="8.5" fill="#6d28d9">预取隐藏在 FFMA 里</text>
              {/* STS：LDG 数据到达后 */}
              <rect x={x+200} y={rows[3].y} width="24" height="26" rx="6" fill="#7dd3fc"/>
              <text x={x+212} y={rows[3].y+17} textAnchor="middle" fontSize="8" fontWeight="700" fill="#0c4a6e">STS</text>
              <rect x={x+230} y={rows[3].y} width="10" height="26" rx="4" fill="#86efac"/>
            </g>
          );
        })}

        {/* 光标 */}
        {cursor !== null && (
          <g>
            <line x1={cursor} x2={cursor} y1="24" y2={H-30} stroke="#0f172a" strokeWidth="2"/>
            <circle cx={cursor} cy="24" r="4" fill="#0f172a"/>
          </g>
        )}
        <text x="6" y={H-8} fontSize="10.5" fill="#64748b">
          {mode==="serial"
            ? "串行：每个阶段都等上一个阶段 —— 计算单元利用率 ≈ 33%（示意）"
            : "双缓冲：LDG 后台飞行 + LDS 预取嵌进 FFMA —— 计算单元几乎从不空闲（示意）"}
        </text>
      </svg>
    </div>
  );
}

// =================================================================
// Section 2：两级缓冲的状态机
// =================================================================
function BufferStatePanel({tile, step, playing}) {
  const info = stepInfo(step);
  const buf = tile % 2, nextBuf = 1 - buf;
  const kk = info.group==="ploop" ? info.kk : 0;

  const bufRole = (b) => {
    if (step === 18) return "sync";
    if (b === buf) return step >= 17 ? "draining" : "compute";
    return step >= 17 || step === 0 ? "receiving" : "loading";
  };
  const roleStyle = {
    compute:   {fill:"#dcfce7", stroke:"#16a34a", label:"计算中", tc:"#14532d"},
    loading:   {fill:"#dbeafe", stroke:"#3b82f6", label:"预载目标", tc:"#1e3a8a"},
    receiving: {fill:"#bfdbfe", stroke:"#2563eb", label:"接收 LDG 数据", tc:"#1e3a8a"},
    draining:  {fill:"#fef9c3", stroke:"#ca8a04", label:"本轮读完", tc:"#713f12"},
    sync:      {fill:"#ede9fe", stroke:"#7c3aed", label:"同步切换", tc:"#4c1d95"},
  };

  const regActive = info.group==="ploop" ? (info.sub===0 ? (kk+1)&1 : kk&1) : (step===19 ? 0 : kk&1);
  const regPrefetch = info.group==="ploop" && info.sub===0 ? (kk+1)&1 : null;

  const Box = ({x, y, w, h, title, sub, role, pulse}) => {
    const s = roleStyle[role] || roleStyle.compute;
    return (
      <g>
        <rect x={x} y={y} width={w} height={h} rx="12" fill={s.fill} stroke={s.stroke} strokeWidth="2"
              className={pulse?"pulse-soft":""}/>
        <text x={x+w/2} y={y+h/2-4} textAnchor="middle" fontSize="12.5" fontWeight="800" fill={s.tc}>{title}</text>
        <text x={x+w/2} y={y+h/2+14} textAnchor="middle" fontSize="10" fill={s.tc} opacity="0.8">{sub}</text>
        <rect x={x} y={y-20} width={w} height="16" rx="6" fill={s.stroke} opacity="0.14"/>
        <text x={x+w/2} y={y-8} textAnchor="middle" fontSize="9" fontWeight="800" fill={s.tc}>{s.label}</text>
      </g>
    );
  };

  return (
    <div className="soft-card bg-white p-4 overflow-x-auto scrollbar-thin">
      <svg viewBox="0 0 940 330" className="w-full min-w-[640px]">
        <ArrowMarker/>
        <text x="14" y="24" fontSize="13.5" fontWeight="800" fill="#0f172a">
          Shared Memory 双缓冲（K-Loop 级）· 当前 tile {tile} · buf = {buf}
        </text>

        {/* 两个 smem buffer */}
        <Box x={40} y={80} w={260} h={92} role={bufRole(0)}
             title={`Buffer 0：smem_A_T[0] + smem_B[0]`} sub="8 KB / tile" pulse={bufRole(0)==="receiving"&&playing}/>
        <Box x={360} y={80} w={260} h={92} role={bufRole(1)}
             title={`Buffer 1：smem_A_T[1] + smem_B[1]`} sub="8 KB / tile" pulse={bufRole(1)==="receiving"&&playing}/>

        {/* Global → ldg_stash → next_buf 的数据流 */}
        <rect x={680} y={80} width={230} height={92} rx="12" fill="#fff7ed" stroke="#fb923c" strokeWidth="2"
              className={step===0&&playing?"pulse-soft":""}/>
        <text x={795} y={116} textAnchor="middle" fontSize="12.5" fontWeight="800" fill="#9a3412">ldg_stash（寄存器暂存）</text>
        <text x={795} y={136} textAnchor="middle" fontSize="10" fill="#9a3412">{A_F4}+{B_F4} 个 float4 = {(A_F4+B_F4)*4} 寄存器/线程</text>
        <text x={795} y={154} textAnchor="middle" fontSize="9.5" fill="#c2410c">
          {step===0 ? "正在接收 LDG（异步）" : step===17 ? "正在 STS 写入 next_buf" : "空闲"}
        </text>

        {step===17 && (
          <g>
            <path d="M676 126 L630 126" fill="none" stroke="#f97316" strokeWidth="2.6"
                  markerEnd="url(#arrowOrange)" className="flow-line"/>
            <text x="653" y="116" textAnchor="middle" fontSize="9" fontWeight="700" fill="#c2410c">STS</text>
          </g>
        )}

        {/* Register 双缓冲（p-Loop 级） */}
        <text x="14" y="216" fontSize="13" fontWeight="800" fill="#0f172a">Register 双缓冲（p-Loop 级）：计算用一组，预取写另一组</text>
        {[0,1].map(g=>{
          const isAct = g === regActive;
          const isPre = g === regPrefetch;
          const fill = isPre ? "#dbeafe" : isAct ? "#dcfce7" : "#f8fafc";
          const stroke = isPre ? "#3b82f6" : isAct ? "#16a34a" : "#e2e8f0";
          return (
            <g key={"rg"+g}>
              <rect x={40+g*320} y={236} width={280} height={64} rx="12" fill={fill} stroke={stroke} strokeWidth="2"
                    className={isPre&&playing?"pulse-soft":""}/>
              <text x={180+g*320} y={262} textAnchor="middle" fontSize="12" fontWeight="800" fill="#0f172a">
                reg_A[{g}][8] · reg_B[{g}][8]
              </text>
              <text x={180+g*320} y={282} textAnchor="middle" fontSize="10" fill="#475569">
                {isPre ? "← 正在预取 kk+1 步" : isAct ? "← 正在用于 FFMA" : "空闲"}
              </text>
            </g>
          );
        })}
        <text x="14" y="322" fontSize="10.5" fill="#64748b">
          两级双缓冲叠加：外层隐藏 Global 延迟（300+ 周期），内层隐藏 Shared 延迟（20~30 周期）。
        </text>
      </svg>
    </div>
  );
}

function ArrowMarker() {
  return (
    <defs>
      <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
      </marker>
      <marker id="arrowBlue2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
      </marker>
    </defs>
  )
}

// =================================================================
// Section 2 右侧：步骤列表
// =================================================================
function StepsList({tile, step, setStep}) {
  const nSteps = 21;
  return (
    <div className="soft-card bg-white p-4">
      <div className="font-extrabold text-slate-900 mb-2">一次 K tile 迭代的指令编排</div>
      <div className="space-y-1 max-h-[360px] overflow-y-auto scrollbar-thin pr-1">
        {Array.from({length:nSteps}).map((_,s)=>{
          const info = stepInfo(s);
          const cur = s === step;
          const isSync = info.group === "sync";
          const isLdg = info.group === "ldg";
          const isSts = info.group === "sts";
          const color = isSync ? "bg-violet-100 border-violet-300"
                      : isLdg || isSts ? "bg-orange-50 border-orange-200"
                      : info.group==="ploop" && info.sub===0 ? "bg-blue-50 border-blue-200"
                      : "bg-rose-50 border-rose-100";
          return (
            <button key={s} onClick={()=>setStep(s)}
              className={`w-full text-left rounded-lg border px-2.5 py-1.5 text-[11px] leading-5 transition ${color} ${cur?"ring-2 ring-slate-900 scale-[1.02]":"opacity-80 hover:opacity-100"}`}>
              <span className="mono font-bold mr-1.5">{String(s).padStart(2,"0")}</span>
              {isSync && <span className="inline-block mr-1 px-1 rounded bg-violet-600 text-white text-[9px] font-bold align-middle">唯一同步</span>}
              {s===0 && <span className="inline-block mr-1 px-1 rounded bg-orange-500 text-white text-[9px] font-bold align-middle">异步</span>}
              {info.label}
            </button>
          );
        })}
      </div>
      <div className="mt-2 text-[11px] text-slate-500 leading-5">
        Prologue（主循环前）：同步加载 tile 0 → 预取 kk=0 寄存器 —— 流水线的填充阶段。
      </div>
    </div>
  );
}

// =================================================================
// Section 3：LDG 与 STS 必须拆开
// =================================================================
function SplitPanel() {
  return (
    <div className="grid xl:grid-cols-2 gap-5 items-start">
      <div className="soft-card bg-white p-4">
        <div className="font-extrabold text-slate-900 mb-2">❌ 连在一起：流水线断掉</div>
        <pre className="mono text-xs leading-6 bg-slate-50 border rounded-xl p-3 overflow-x-auto scrollbar-thin">{`// LDG 之后立即 STS
float4 v = *(const float4*)&A[...]; // LDG
smem_A_T[...] = v;                  // STS：必须等 LDG 返回
// → LDG 变成同步的，计算单元空等 300 周期`}</pre>
        <div className="overflow-x-auto scrollbar-thin mt-3">
          <svg viewBox="0 0 420 96" className="w-full min-w-[320px]">
            <text x="8" y="16" fontSize="10" fontWeight="700" fill="#475569">时序：</text>
            <rect x="8" y="26" width="150" height="22" rx="5" fill="#93c5fd"/>
            <text x="83" y="41" textAnchor="middle" fontSize="9" fontWeight="700" fill="#1e3a8a">LDG（等数据）</text>
            <rect x="158" y="26" width="60" height="22" rx="5" fill="#7dd3fc"/>
            <text x="188" y="41" textAnchor="middle" fontSize="9" fontWeight="700" fill="#0c4a6e">STS</text>
            <rect x="218" y="26" width="90" height="22" rx="5" fill="#fca5a5"/>
            <text x="263" y="41" textAnchor="middle" fontSize="9" fontWeight="700" fill="#7f1d1d">FFMA</text>
            <rect x="8" y="56" width="210" height="22" rx="5" fill="#fee2e2" stroke="#fca5a5" strokeDasharray="4 3"/>
            <text x="113" y="71" textAnchor="middle" fontSize="9" fontWeight="700" fill="#dc2626">计算单元空转 210 周期</text>
          </svg>
        </div>
      </div>
      <div className="soft-card bg-white p-4">
        <div className="font-extrabold text-slate-900 mb-2">✓ 拆开：发射与写回分离</div>
        <pre className="mono text-xs leading-6 bg-slate-50 border rounded-xl p-3 overflow-x-auto scrollbar-thin">{`// issue_ldg_A / issue_ldg_B：只发射，结果存入
// 线程私有的 ldg_stash（不碰 smem）
issue_ldg_A(..., ldg_A_stash);   // 异步，立即返回

// ……中间隔着一整个 p-Loop 的 FFMA……

// store_ldg_A_to_shared：数据到达后写入
// 下一块 buffer（转置散写）
store_ldg_A_to_shared(smem_A_T[next], ..., ldg_A_stash);`}</pre>
        <div className="overflow-x-auto scrollbar-thin mt-3">
          <svg viewBox="0 0 420 96" className="w-full min-w-[320px]">
            <text x="8" y="16" fontSize="10" fontWeight="700" fill="#475569">时序：</text>
            <rect x="8" y="26" width="240" height="22" rx="5" fill="#93c5fd" opacity="0.8" className="flow-line"/>
            <text x="128" y="41" textAnchor="middle" fontSize="9" fontWeight="700" fill="#1e3a8a">LDG 后台传输（300c）</text>
            <rect x="20" y="56" width="230" height="22" rx="5" fill="#fca5a5"/>
            <text x="135" y="71" textAnchor="middle" fontSize="9" fontWeight="700" fill="#7f1d1d">FFMA 全速 —— 延迟被完全隐藏</text>
          </svg>
        </div>
      </div>
    </div>
  );
}

// =================================================================
// Section 4：同步次数 2 → 1
// =================================================================
function SyncPanel() {
  return (
    <div className="grid xl:grid-cols-[1fr_1fr] gap-5 items-start">
      <div className="space-y-3">
        <div className="soft-card bg-white p-4">
          <div className="text-sm font-extrabold text-rose-700 mb-2">无缓冲：每轮 2 次同步</div>
          <pre className="mono text-xs leading-6 bg-slate-50 border rounded-xl p-3 overflow-x-auto scrollbar-thin">{`for (k0 = 0; k0 < K; k0 += BLOCK_K) {
  load_tile(A, B, smem, ...);  // Global → Shared
  __syncthreads();             // 同步 1：等加载完成
  for (kk...) { /* 外积 */ }
  __syncthreads();             // 同步 2：等读完才能覆盖
}`}</pre>
        </div>
        <div className="soft-card bg-white p-4">
          <div className="text-sm font-extrabold text-emerald-700 mb-2">双缓冲：每轮 1 次同步</div>
          <pre className="mono text-xs leading-6 bg-slate-50 border rounded-xl p-3 overflow-x-auto scrollbar-thin">{`for (k0 = 0; k0 < K; k0 += BLOCK_K) {
  compute(smem[buf], ...);        // 读 buf
  store_ldg_to(smem[next_buf]);   // 写 next_buf
  __syncthreads();                // 唯一同步：切换 buffer
  buf = next_buf;
}`}</pre>
        </div>
      </div>
      <div className="space-y-3">
        <div className="soft-card bg-white p-4 text-sm text-slate-600 leading-7">
          <div className="font-extrabold text-slate-900">为什么一次就够</div>
          <ul className="mt-2 list-disc pl-5 space-y-1.5">
            <li>计算读 <span className="mono">buf</span>、加载写 <span className="mono">next_buf</span> —— 操作不同的内存区域，<b>无竞争</b>。</li>
            <li>唯一的同步点在“切换”瞬间：确保所有线程完成本轮工作后再交换角色。</li>
            <li>K=4096、BLOCK_K=8 时共 512 轮迭代 —— 省下的 512 次同步会累积成可观收益。</li>
          </ul>
        </div>
        <div className="soft-card bg-white p-4">
          <div className="font-extrabold text-slate-900 mb-2">__syncthreads() 的三类代价</div>
          <table className="w-full text-sm">
            <tbody>
              {[["延迟","等待所有 warp 到达，数十周期"],
                ["流水线冲刷","同步点清空流水线，之后要重新填充"],
                ["阻塞","到达早的 warp 空等，浪费调度机会"]].map((r,i)=>(
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-2 pr-3 font-bold text-slate-700 whitespace-nowrap">{r[0]}</td>
                  <td className="py-2 text-slate-500">{r[1]}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// =================================================================
// App
// =================================================================
function App(){
  const [playing,setPlaying]=useState(true);
  const [speed,setSpeed]=useState(1);
  const [demoK,setDemoK]=useState(64);
  const tiles = demoK/BK;
  const [kIndex,setKIndex]=useState(0);
  const [step,setStep]=useState(0);      // 0..20
  const [tlMode,setTlMode]=useState("double");
  const timer=useRef(null);

  function nextStep(){
    if(step<20){ setStep(step+1); return; }
    setStep(0);
    if(kIndex<tiles-1) setKIndex(kIndex+1);
    else { setKIndex(0); setPlaying(false); }
  }
  function reset(){ setPlaying(false); setKIndex(0); setStep(0); }

  useEffect(()=>{
    if(!playing) return;
    const ms = Math.max(140, 620/speed);
    timer.current=setTimeout(nextStep, ms);
    return ()=>clearTimeout(timer.current);
  },[playing, speed, step, kIndex, tiles]);

  const info = stepInfo(step);
  const badge = info.group==="ldg" ? {name:"发射 LDG", detail:"异步 → ldg_stash", color:"orange"}
              : info.group==="ploop" ? {name:"p-Loop", detail:`kk=${info.kk} · ${info.sub===0?"预取寄存器":"64 FMA"}`, color:"rose"}
              : info.group==="sts" ? {name:"STS 写回", detail:"stash → next_buf", color:"blue"}
              : info.group==="sync" ? {name:"唯一同步", detail:"__syncthreads()", color:"purple"}
              : info.group==="prefetch0" ? {name:"预取", detail:"新 buffer kk=0", color:"blue"}
              : {name:"切换", detail:"buf = next_buf", color:"green"};

  return (
    <main className="max-w-[1480px] mx-auto px-4 sm:px-6 py-7 sm:py-10">

      <header className="mb-6">
        <div className="card relative overflow-hidden p-6 sm:p-9">
          <div className="pointer-events-none absolute -top-28 -right-24 w-80 h-80 rounded-full bg-gradient-to-br from-blue-200/45 to-emerald-200/40 blur-3xl"/>
          <div className="pointer-events-none absolute -bottom-32 -left-20 w-72 h-72 rounded-full bg-gradient-to-tr from-emerald-200/35 to-blue-200/30 blur-3xl"/>
          <div className="relative flex flex-col xl:flex-row xl:items-end xl:justify-between gap-6">
            <div>
              <div className="flex flex-wrap gap-2 mb-4">
                <Pill color="blue">smem ×2（K-Loop 级）</Pill>
                <Pill color="green">reg ×2（p-Loop 级）</Pill>
                <Pill color="orange">LDG 暂存 {A_F4}+{B_F4} float4</Pill>
                <Pill color="purple">每轮 2 次同步 → 1 次</Pill>
              </div>
              <h1 className="text-3xl sm:text-[2.5rem] font-black tracking-tight text-slate-950 leading-tight">
                CUDA GEMM：双缓冲与流水线 动图解
              </h1>
              <p className="mt-3 text-slate-600 max-w-4xl leading-7">
                对应 <span className="mono font-semibold">matmul_buffer.cuh</span>（笔记 §9）。访存量已经不是瓶颈，但 Global 的 300+ 周期与
                Shared 的 20~30 周期仍会让计算单元空转。双缓冲准备两套 smem、两组寄存器：
                <b>用 buf 计算，同时往 next_buf 预载</b> —— 乒乓球循环，把等待期全部填满。
              </p>
            </div>
            <div className="text-sm text-slate-500 xl:text-right shrink-0">
              <div>单页交互演示 · React + Tailwind CSS + SVG</div>
              <div className="mt-1">前置知识：<a className="text-blue-600 font-semibold hover:underline" href="./gemm_bank_interactive.html">Z-order 消除 bank conflict</a></div>
            </div>
          </div>
        </div>
      </header>

      <section className="glass-bar rounded-2xl p-4 sm:p-5 sticky top-3 z-20 mb-6">
        <div className="flex flex-col xl:flex-row xl:items-center gap-4 xl:justify-between">
          <div className="flex flex-wrap items-center gap-2">
            <button onClick={()=>setPlaying(!playing)} className={`btn ${playing?"btn-dark":"btn-blue"}`}>
              {playing ? "暂停" : "播放"}
            </button>
            <button onClick={()=>{setPlaying(false);nextStep();}} className="btn btn-ghost">单步执行</button>
            <button onClick={reset} className="btn btn-ghost">重置</button>
            <div className="hidden sm:block w-px h-8 bg-slate-200 mx-1"/>
            <div className="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-white/70 px-3 py-1.5">
              <Pill color={badge.color}>{badge.name}</Pill>
              <span className="text-sm text-slate-600">{badge.detail}</span>
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-4 text-sm">
            <label className="flex items-center gap-2">
              <span className="text-slate-500">演示 K</span>
              <select value={demoK} onChange={e=>{setPlaying(false);setDemoK(Number(e.target.value));setKIndex(0);setStep(0);}}
                className="rounded-lg border border-slate-200 bg-white px-2 py-1.5 font-semibold">
                <option value="32">32</option>
                <option value="64">64</option>
                <option value="128">128</option>
              </select>
            </label>
            <label className="flex items-center gap-2">
              <span className="text-slate-500">速度</span>
              <input type="range" min=".5" max="3" step=".5" value={speed}
                     onChange={e=>setSpeed(Number(e.target.value))} className="accent-blue-600"/>
              <span className="w-8 font-bold">{speed}×</span>
            </label>
          </div>
        </div>
        <div className="hairline my-4"/>
        <div className="flex items-center gap-3">
          <span className="text-xs font-bold text-slate-400 shrink-0">K 时间轴</span>
          <div className="overflow-x-auto scrollbar-thin pb-1">
            <div className="flex min-w-max gap-2">
              {Array.from({length:tiles}).map((_,i)=>(
                <button key={i} onClick={()=>{setPlaying(false);setKIndex(i);setStep(0);}}
                  className={`chip ${i===kIndex ? "chip-now" : i<kIndex ? "chip-done" : ""}`}>
                  k={i*8}
                </button>
              ))}
            </div>
          </div>
        </div>
      </section>

      <section className="card p-4 sm:p-5 mb-6">
        <SecTitle n="1" title="问题与答案：串行时间轴 vs 流水线时间轴"
          right={
            <div className="flex gap-2">
              <button onClick={()=>setTlMode("serial")} className={`btn ${tlMode==="serial"?"btn-dark":"btn-ghost"}`}>串行</button>
              <button onClick={()=>setTlMode("double")} className={`btn ${tlMode==="double"?"btn-dark":"btn-ghost"}`}>双缓冲</button>
            </div>
          }>
          串行模式下每个阶段都在等上一个阶段：加载的 300+ 周期里计算单元完全空转。
          切到双缓冲：LDG 后台飞行、LDS 预取嵌在 FFMA 之间，计算单元几乎从不空闲。
          播放时黑色光标与第 2 节的状态机同步推进。
        </SecTitle>
        <TimelinePanel mode={tlMode} tile={kIndex} step={step}/>
      </section>

      <section className="card p-4 sm:p-5 mb-6">
        <SecTitle n="2" title="两级双缓冲的状态机（随播放推进）">
          上排：两套 Shared Memory 交替承担「计算中 / 接收预载」；下排：两组寄存器交替承担「FFMA 使用 / 预取写入」。
          右侧步骤列表可点击跳转，注意第 18 步是整个循环唯一的同步点。
        </SecTitle>
        <div className="grid xl:grid-cols-[minmax(600px,1fr)_320px] gap-4 items-start">
          <BufferStatePanel tile={kIndex} step={step} playing={playing}/>
          <StepsList tile={kIndex} step={step} setStep={(s)=>{setPlaying(false);setStep(s);}}/>
        </div>
      </section>

      <section className="card p-4 sm:p-5 mb-6">
        <SecTitle n="3" title="关键细节：把 LDG 和 STS 拆开，流水线才成立">
          <span className="mono">issue_ldg_*</span> 只发射不等待，数据落在线程私有的 <span className="mono">ldg_stash</span>；
          隔着一整个 p-Loop 的 FFMA 之后，<span className="mono">store_ldg_*_to_shared</span> 再写入下一块 buffer。
        </SecTitle>
        <SplitPanel/>
        <div className="mt-3 rounded-xl bg-orange-50 border border-orange-100 px-4 py-3 text-xs leading-6 text-orange-950">
          <b>寄存器代价：</b>ldg_stash 需要 ({A_F4}+{B_F4})×4 = {(A_F4+B_F4)*4} 个额外寄存器/线程，且流水线深度受寄存器容量限制（通常 2~3 级）——
          这正是下一节 <a className="font-semibold underline" href="./gemm_cp_async_interactive.html">cp.async</a> 要解决的问题。
        </div>
      </section>

      <section className="card p-4 sm:p-5 mb-6">
        <SecTitle n="4" title="同步优化：2 次 → 1 次">
          双缓冲把「等加载」和「等读完」合并成一个切换点 —— 省下来就是赚到。
        </SecTitle>
        <SyncPanel/>
      </section>

      <section className="grid lg:grid-cols-3 gap-4">
        <div className="card p-5">
          <div className="flex items-center gap-2"><Pill color="blue">①</Pill><h3 className="font-black tracking-tight">乒乓球循环</h3></div>
          <p className="text-sm leading-6 text-slate-600 mt-3">
            两套缓冲区交替承担「计算」与「加载」：迭代偶数轮用 Buffer 0 算、往 Buffer 1 装；奇数轮反过来。
            结构极简，却是所有现代 GEMM 流水线的骨架。
          </p>
        </div>
        <div className="card p-5">
          <div className="flex items-center gap-2"><Pill color="green">②</Pill><h3 className="font-black tracking-tight">延迟去哪了</h3></div>
          <p className="text-sm leading-6 text-slate-600 mt-3">
            LDG 的 300+ 周期被本 tile 的 FFMA 覆盖，LDS 的 20~30 周期被下一组 FFMA 覆盖。
            整个 K 循环中计算单元从未空闲 —— 这就是「隐藏延迟」的确切含义。
          </p>
        </div>
        <div className="card p-5">
          <div className="flex items-center gap-2"><Pill color="purple">③</Pill><h3 className="font-black tracking-tight">指令顺序即性能</h3></div>
          <p className="text-sm leading-6 text-slate-600 mt-3">
            同样的代码块，排列顺序不同性能天差地别：LDG 要尽早发射、STS 要在数据到达后、同步要唯一。
            流水线不是硬件送的，是程序员的指令编排挣来的。
          </p>
        </div>
      </section>

      <section className="mt-6 rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-sm text-amber-950 leading-6">
        <b>准确性细节：</b>
        ① 时间轴中的周期数（300c / 25c / 利用率）为<b>示意量级</b>，实际取决于架构与访存模式。
        ② <span className="mono">issue_ldg_*</span> 的边界分支逐元素补零，保证越界时 stash 仍是确定值，STS 阶段无需再判断。
        ③ 主循环中发射 LDG 的条件是 <span className="mono">kk==0 &amp;&amp; has_next</span>：最后一个 tile 不发射，避免越界读。
        ④ 寄存器中转占用 {(A_F4+B_F4)*4} 个寄存器/线程并限制流水线深度 —— Ampere 的 cp.async 可以同时解决这两个问题。
      </section>

      <footer className="py-10 text-center text-xs text-slate-400">
        CUDA GEMM Double Buffering · Interactive Teaching Diagram ·
        代码 <span className="mono">matmul_buffer.cuh</span> · 笔记 note.md §9 ·
        系列：<a className="hover:underline" href="./gemm_block_tiling_interactive.html">Block</a> →
        <a className="hover:underline" href="./gemm_thread_tiling_interactive.html"> Thread</a> →
        <a className="hover:underline" href="./gemm_warp_tiling_interactive.html"> Warp</a> →
        <a className="hover:underline" href="./gemm_vectorized_interactive.html"> float4</a> →
        <a className="hover:underline" href="./gemm_bank_interactive.html"> Z-order</a> →
        <a className="hover:underline" href="./gemm_double_buffer_interactive.html"> 双缓冲</a> →
        <a className="hover:underline" href="./gemm_cp_async_interactive.html"> cp.async</a>
      </footer>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
