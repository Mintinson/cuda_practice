<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

// -----------------------------------------------------------------
// 与 matmul_cp_async.cuh 一致的常量
//   BLOCK 128×128, BK=8, warp 4×8, lane tile 8×8, 256 线程
//   NUM_STAGES = 3（推荐）；每 stage 的 smem = (8×128 + 8×128)×4B = 8 KB
//   A：cp.async 无法转置 → 仍走 LDG+STS（load_tile_A_vec4_transposed）
//   B：行主序 → cp.async 直接拷贝
// -----------------------------------------------------------------
const BK = 8;
const STAGE_KB = 8;

function Pill({children, color="slate"}) {

// =================================================================
// Section 1：两条数据通路

            <rect x="342" y="52" width="104" height="60" rx="12" fill="#ecfdf5" stroke="#6ee7b7" strokeWidth="2"/>
            <text x="394" y="78" textAnchor="middle" fontSize="12" fontWeight="800" fill="#065f46">Shared</text>

            <text x="230" y="78" textAnchor="middle" fontSize="12" fontWeight="800" fill="#94a3b8">Register</text>

            <rect x="342" y="52" width="104" height="60" rx="12" fill="#ecfdf5" stroke="#6ee7b7" strokeWidth="2"/>
            <text x="394" y="78" textAnchor="middle" fontSize="12" fontWeight="800" fill="#065f46">Shared</text>

            <text x="230" y="142" textAnchor="middle" fontSize="10" fontWeight="800" fill="#0e7490">cp.async（硬件异步引擎直达）</text>
            <text x="230" y="160" textAnchor="middle" fontSize="10" fill="#64748b">1 条指令 · 发起后立即返回 · 深度可达 4~6 级</text>

// =================================================================
// Section 2：三条 PTX 指令 + 组队列语义
// =================================================================
function PTXProtocol() {
  const [N, setN] = useState(1); // wait_group 的参数
  const groups = [
    {id:"G0", done:true},{id:"G1", done:true},{id:"G2", done:true},
    {id:"G3", done:N<2},{id:"G4", done:false},
  ];
  // wait_group<N>：阻塞直到最多 N 个组未完成 → G0..G_{4-N} 必须完成
  const mustWaitUntil = 4 - N;
  return (
    <div className="grid xl:grid-cols-[1fr_1fr] gap-5 items-start">
      <div className="soft-card bg-white p-4">
        <div className="font-extrabold text-slate-900 mb-2">完整协议：三条 PTX 指令</div>
        <div className="space-y-2.5">
          {[
            {n:"①", t:"cp.async.cg.shared.global [smem], [gmem], 16;", d:"把包裹交给快递员：发起异步拷贝，立即返回。.cg 只走 L2 不分配 L1，16B 是唯一合法宽度。", c:"border-cyan-200 bg-cyan-50/60 text-cyan-950"},
            {n:"②", t:"cp.async.commit_group;", d:"告诉快递员「这批算一个订单」：把此前未提交的 cp.async 打包成组，每线程独立维护。", c:"border-violet-200 bg-violet-50/60 text-violet-950"},
            {n:"③", t:"cp.async.wait_group N;", d:"「等到最多还剩 N 个订单在路上」—— 控制 N 即控制流水线深度。", c:"border-amber-200 bg-amber-50/60 text-amber-950"},
          ].map(x=>(
            <div key={x.n} className={`rounded-xl border px-3.5 py-3 ${x.c}`}>
              <div className="flex items-start gap-2.5">
                <span className="font-black text-base">{x.n}</span>
                <div className="min-w-0">
                  <div className="mono text-[11.5px] font-bold break-all">{x.t}</div>
                  <div className="text-xs leading-6 mt-1">{x.d}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
        <div className="mt-3 rounded-xl bg-rose-50 border border-rose-100 px-3.5 py-2.5 text-xs leading-6 text-rose-950">
          <b>易踩的坑：</b><span className="mono">wait_group</span> 是 <b>per-thread</b> 的，只保证「本线程的组到了」；
          smem 是全 block 共享的 —— 线程 A 写的数据线程 B 要读，必须再跟一次 <span className="mono">__syncthreads()</span>。
          「数据到了」+「所有人都能看到」缺一不可。
        </div>
      </div>

      <div className="soft-card bg-white p-4">
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <div className="font-extrabold text-slate-900">wait_group N 的语义</div>
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-500">N =</span>
            {[0,1,2].map(n=>(
              <button key={n} onClick={()=>setN(n)} className={`btn ${N===n?"btn-dark":"btn-ghost"} !py-1 !px-2.5 text-xs`}>{n}</button>
            ))}
          </div>
        </div>
        <div className="overflow-x-auto scrollbar-thin mt-3">
          <svg viewBox="0 0 460 150" className="w-full min-w-[340px]">
            {groups.map((g,i)=>(
              <g key={g.id}>
                <rect x={14+i*88} y="26" width="76" height="40" rx="9"
                      fill={g.done?"#d1fae5":"#dbeafe"} stroke={g.done?"#10b981":"#3b82f6"} strokeWidth="1.6"/>
                <text x={14+i*88+38} y="44" textAnchor="middle" fontSize="11.5" fontWeight="800" fill="#0f172a">{g.id}</text>
                <text x={14+i*88+38} y="58" textAnchor="middle" fontSize="8.5" fill="#475569">{g.done?"已完成":"在途"}</text>
              </g>
            ))}
            <line x1={14 + (mustWaitUntil+1)*88 - 6} x2={14 + (mustWaitUntil+1)*88 - 6} y1="14" y2="82"
                  stroke="#e11d48" strokeWidth="2.6" strokeDasharray="6 4"/>
            <text x={14 + (mustWaitUntil+1)*88 - 6} y="10" textAnchor="middle" fontSize="9.5" fontWeight="800" fill="#e11d48">
              wait_group&lt;{N}&gt; 的阻塞线
            </text>
            <text x="14" y="102" fontSize="10.5" fill="#475569">
              阻塞直到最多 {N} 个组未完成 → {mustWaitUntil+1 <= 4 ? `G0..G${mustWaitUntil} 必须就绪` : "全部就绪"}，
              允许 {N} 个组在飞。
            </text>
            <text x="14" y="124" fontSize="10.5" fill="#64748b">
              3 级流水线取 N = NUM_STAGES - 2 = 1：等下一 tile 就绪，同时允许再下一个 tile 在途。
            </text>
            <text x="14" y="144" fontSize="10" fill="#94a3b8">kStages=2 → wait_group(0) · 3 → wait_group(1) · 4 → wait_group(2)</text>
          </svg>
        </div>
      </div>
    </div>
  );
}

// =================================================================
// Section 3：3 级流水线的 stage 看板 + 步骤列表
// =================================================================
const PROLOGUE = 7;   // 前 7 步是 Prologue
const PER_TILE = 21;  // 每 tile 21 步

function stepInfo(step, kIndex, numStages) {
  const N = numStages;
  if (step < PROLOGUE) {
    const map = [
      `发射 stage 0：A 走 LDG+STS（转置）· B 走 cp.async`,
      `cp.async.commit_group → G0`,
      `发射 stage 1（同上）`,
      `commit_group → G1`,
      `cp_async_wait_group<${N-2}>：等 stage 0 就绪（允许 ${N-2} 个组在飞）`,
      `__syncthreads()`,
      `预取 stage 0 的 kk=0 寄存器`,
    ];
    return {group: [0,2].includes(step)?"issue":[1,3].includes(step)?"commit":step===4?"wait":step===5?"sync":"prefetch0",
            label: map[step], prologue:true};
  }
  const s = step - PROLOGUE;
  const nextFetch = kIndex + N - 1;
  if (s === 0) return {group:"issue", label:`发射 tile ${nextFetch} → stage ${nextFetch%N}（A: LDG+STS · B: cp.async），立即返回`};
  if (s === 1) return {group:"commit", label:`commit_group → G${nextFetch}`};
  if (s >= 2 && s <= 17) {
    const kk = Math.floor((s-2)/2), sub = (s-2)%2;
    return {group:"ploop", kk, sub,
      label: sub===0 ? `预取 reg_A/B[${(kk+1)&1}] ← stage ${kIndex%N} 的第 kk+1=${kk+1} 步（LDS.128）`
                     : `FFMA(kk=${kk})：用 reg[${kk&1}] 做 8×8 外积（64 FMA）`};
  }
  if (s === 18) return {group:"wait", label:`cp_async_wait_group<${N-2}>：等 tile ${kIndex+1} 就绪（允许 ${N-2} 个组在飞）`};
  if (s === 19) return {group:"sync", label:"__syncthreads()：跨线程可见 + 切换 stage"};
  return {group:"prefetch0", label:`预取 stage ${(kIndex+1)%N} 的 kk=0 寄存器`};
}

function StageBoard({kIndex, step, numStages, playing}) {
  const info = stepInfo(step, kIndex, numStages);
  const tiles = 6; // 演示 6 个 tile 的轮转
  // 每个 stage 的状态
  const stageState = (s) => {
    const ownerTiles = [];
    for (let t=0;t<tiles;t++) if (t%numStages===s) ownerTiles.push(t);
    const computing = ownerTiles.includes(kIndex);
    const loading = info.group==="issue" && (kIndex+numStages-1)%numStages===s && !info.prologue;
    const prologueLoading = info.prologue && [0,2].includes(step) && s===step/2;
    if (computing) return "compute";
    if (loading || prologueLoading) return "loading";
    if (ownerTiles.some(t=>t===kIndex+1)) return "ready";
    return "idle";
  };
  const st = {
    compute: {fill:"#dcfce7", stroke:"#16a34a", tag:"计算中", tc:"#14532d"},
    loading: {fill:"#dbeafe", stroke:"#3b82f6", tag:"cp.async 在飞", tc:"#1e3a8a"},
    ready:   {fill:"#ecfdf5", stroke:"#6ee7b7", tag:"就绪 · 下一个", tc:"#065f46"},
    idle:    {fill:"#f8fafc", stroke:"#e2e8f0", tag:"空闲 / 旧数据", tc:"#94a3b8"},
  };
  const inFlight = info.group==="issue" ? `${numStages-1} 个 tile` : null;

  return (
    <div className="soft-card bg-white p-4 overflow-x-auto scrollbar-thin">
      <svg viewBox="0 0 940 300" className="w-full min-w-[620px]">
        <text x="14" y="24" fontSize="13.5" fontWeight="800" fill="#0f172a">
          Shared Memory 的 {numStages} 个 stage · 计算 tile {kIndex} 使用 stage {kIndex%numStages}
        </text>
        {Array.from({length:numStages}).map((_,s)=>{
          const state = stageState(s);
          const cfg = st[state];
          const owner = [];
          for (let t=0;t<tiles;t++) if (t%numStages===s) owner.push(t);
          return (
            <g key={"st"+s}>
              <rect x={20+s*300} y={44} width={280} height={110} rx="14" fill={cfg.fill} stroke={cfg.stroke} strokeWidth="2.2"
                    className={state==="loading"&&playing?"pulse-soft":""}/>
              <text x={20+s*300+140} y={74} textAnchor="middle" fontSize="13" fontWeight="800" fill={cfg.tc}>
                stage {s} · smem_A_T[{s}] + smem_B[{s}]
              </text>
              <text x={20+s*300+140} y={96} textAnchor="middle" fontSize="10.5" fill={cfg.tc} opacity="0.85">
                承载 tile {owner.join(", ")}（t % {numStages} = {s}）
              </text>
              <rect x={20+s*300+70} y={110} width={140} height="26" rx="12" fill={cfg.stroke} opacity="0.16"/>
              <text x={20+s*300+140} y={127} textAnchor="middle" fontSize="10" fontWeight="800" fill={cfg.tc}>{cfg.tag}</text>
              <text x={20+s*300+140} y={148} textAnchor="middle" fontSize="9" fill={cfg.tc} opacity="0.7">{STAGE_KB} KB</text>
            </g>
          );
        })}
        {/* 轮转时间轴 */}

        {Array.from({length:6}).map((_,t)=>{
          const s = t%numStages;
          const x = 20 + t*150;
          const isCur = t===kIndex;

          {inFlight ? `发射后立即返回：当前 ${inFlight} 在途 —— 流水线从不空等 Global 延迟` :
           "主循环节奏：发射 tile k+2 → 计算 tile k → wait_group<1> → sync"}
        </text>
      </svg>
    </div>
  );
}

function StepsList({step, setStep}) {
  const total = PROLOGUE + PER_TILE;
  return (
    <div className="soft-card bg-white p-4">
      <div className="font-extrabold text-slate-900 mb-2">Prologue + 一次主循环迭代</div>
      <div className="space-y-1 max-h-[420px] overflow-y-auto scrollbar-thin pr-1">
        {Array.from({length:total}).map((_,s)=>{
          const info = stepInfo(s, 0, 3);
          const cur = s === step;
          const isSync = info.group==="sync";
          const isWait = info.group==="wait";
          const isAsync = info.group==="issue" || info.group==="commit";
          const color = isSync ? "bg-violet-100 border-violet-300"
                      : isWait ? "bg-amber-50 border-amber-300"
                      : isAsync ? "bg-cyan-50 border-cyan-200"
                      : info.group==="ploop" && info.sub===0 ? "bg-blue-50 border-blue-200"
                      : "bg-rose-50 border-rose-100";
          return (
            <button key={s} onClick={()=>setStep(s)}
              className={`w-full text-left rounded-lg border px-2.5 py-1.5 text-[11px] leading-5 transition ${color} ${cur?"ring-2 ring-slate-900 scale-[1.02]":"opacity-80 hover:opacity-100"}`}>
              <span className="mono font-bold mr-1.5">{String(s).padStart(2,"0")}</span>
              {info.prologue && <span className="inline-block mr-1 px-1 rounded bg-slate-700 text-white text-[9px] font-bold align-middle">Prologue</span>}
              {isAsync && <span className="inline-block mr-1 px-1 rounded bg-cyan-600 text-white text-[9px] font-bold align-middle">异步</span>}
              {isSync && <span className="inline-block mr-1 px-1 rounded bg-violet-600 text-white text-[9px] font-bold align-middle">同步</span>}
              {info.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

        </div>
        <pre className="mono text-[11px] leading-6 bg-slate-50 border rounded-xl p-3 overflow-x-auto scrollbar-thin">{`float4 v = *(const float4*)&A[global_row*K + global_col]; // LDG
smem_A_T[a_col4*4+0][r] = v.x;  // STS ×4：转置散写
smem_A_T[a_col4*4+1][r] = v.y;
smem_A_T[a_col4*4+2][r] = v.z;
smem_A_T[a_col4*4+3][r] = v.w;`}</pre>
        <div className="mt-2 text-xs text-orange-700 font-bold">LDG → STS 的依赖链仍在：A 的加载延迟没有被完全隐藏（进一步优化的空间）</div>
      </div>
    </div>
  );
}

                占寄存器、限制深度。Ampere 的 <span className="mono">cp.async</span> 开辟了 Global → Shared 的硬件直达通路：
